<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>식당 청소 일정 생성기</title>
<style>
:root {
  --bg: #F5F7FA;
  --card: #FFFFFF;
  --ink: #1F2937;
  --muted: #6B7280;
  --border: #E5E7EB;
  --primary: #2563EB;
  --primary-dark: #1D4ED8;
  --accent: #F97316;
  --green: #16A34A;
  --yellow: #EAB308;
  --red: #DC2626;
  --info: #0EA5E9;
  --skip-tint: #FEF9C3;
  --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
  --shadow-lg: 0 4px 16px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  min-height: 100vh;
}
.container { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }

h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.card h2 { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card h2 .count { color: var(--muted); font-weight: 400; font-size: 13px; }

/* Status banner */
.status {
  padding: 12px 16px; border-radius: 10px; font-size: 14px; font-weight: 500;
  margin-bottom: 16px; display: flex; align-items: center; gap: 10px;
  border: 1px solid transparent;
}
.status.green  { background: #DCFCE7; color: #166534; border-color: #BBF7D0; }
.status.yellow { background: #FEF9C3; color: #854D0E; border-color: #FDE68A; }
.status.red    { background: #FEE2E2; color: #991B1B; border-color: #FECACA; }
.status .dot { width: 10px; height: 10px; border-radius: 50%; }
.status.green .dot  { background: var(--green); }
.status.yellow .dot { background: var(--yellow); }
.status.red .dot    { background: var(--red); }

.info-banner {
  background: #E0F2FE; color: #075985; padding: 10px 14px;
  border-radius: 10px; font-size: 13px; margin-bottom: 16px;
  border: 1px solid #BAE6FD;
}

/* Buttons */
.btn {
  padding: 10px 16px; border: none; border-radius: 10px; cursor: pointer;
  font-family: inherit; font-size: 14px; font-weight: 500;
  transition: transform 0.1s, background 0.15s, opacity 0.15s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--ink); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: #E5E7EB; }
.btn-danger { background: transparent; color: var(--red); padding: 4px 8px; font-size: 12px; }
.btn-danger:hover { background: #FEE2E2; }
.btn-large { padding: 14px 20px; font-size: 15px; font-weight: 600; }

/* Add person inline */
.add-row { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.add-row input {
  flex: 1; padding: 9px 12px; border: 1px solid var(--border);
  border-radius: 8px; font-family: inherit; font-size: 14px;
}
.add-row input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: var(--primary); }

/* People table */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.people {
  width: 100%; border-collapse: collapse; font-size: 13px;
  min-width: 720px;
}
table.people th, table.people td {
  padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border);
}
table.people th {
  font-weight: 600; color: var(--muted); font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.5px;
  background: var(--bg);
}
table.people tbody tr.skip-tint { background: var(--skip-tint); }
table.people td.name { text-align: left; font-weight: 500; padding-left: 12px; min-width: 90px; }
table.people td.actions { text-align: right; padding-right: 8px; }
table.people input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary); }
table.people input[type="number"] {
  width: 50px; padding: 4px 6px; border: 1px solid var(--border);
  border-radius: 6px; font-family: inherit; font-size: 13px; text-align: center;
}

/* Generate button row */
.actions-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* Result table */
table.schedule {
  width: 100%; border-collapse: separate; border-spacing: 0;
  font-size: 14px; margin-top: 4px;
}
table.schedule th, table.schedule td {
  padding: 12px 10px; text-align: center; border-bottom: 1px solid var(--border);
}
table.schedule th {
  font-weight: 600; color: var(--muted); font-size: 12px;
  background: var(--bg); letter-spacing: 0.5px;
}
table.schedule td.day-label {
  font-weight: 600; width: 80px; background: #F9FAFB;
}
table.schedule tr.full td { background: #FFFFFF; }
table.schedule tr.partial td:not(.day-label) { background: #FEF9C3; }
table.schedule tr.empty   td:not(.day-label) { background: #FEE2E2; }
.person-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; background: #EFF6FF; color: var(--primary-dark);
  border-radius: 999px; font-size: 13px; font-weight: 500;
  margin: 2px;
}
.badge-2x {
  display: inline-block; padding: 2px 6px; font-size: 10px; font-weight: 700;
  background: var(--accent); color: white; border-radius: 4px;
  margin-left: 4px;
}
.badge-skip {
  display: inline-block; padding: 2px 6px; font-size: 10px; font-weight: 600;
  background: #E5E7EB; color: var(--muted); border-radius: 4px; margin-left: 6px;
}
.badge-priority {
  display: inline-block; padding: 2px 6px; font-size: 10px; font-weight: 600;
  background: #FEF3C7; color: #92400E; border-radius: 4px; margin-left: 6px;
}
.unassigned { color: var(--red); font-weight: 500; font-size: 13px; }

.summary {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px; margin: 16px 0;
}
.stat {
  background: var(--bg); padding: 12px; border-radius: 10px;
  border: 1px solid var(--border);
}
.stat .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat .value { font-size: 22px; font-weight: 700; margin-top: 2px; }
.stat.warn .value { color: var(--red); }
.stat.ok   .value { color: var(--green); }

.exclusion-list, .fail-list {
  background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
  padding: 12px; margin-top: 10px; font-size: 13px;
}
.exclusion-list h4, .fail-list h4 { font-size: 13px; margin-bottom: 8px; color: var(--muted); }
.exclusion-list ul, .fail-list ul { list-style: none; }
.exclusion-list li, .fail-list li { padding: 4px 0; }

@media (max-width: 640px) {
  .container { padding: 16px 10px 32px; }
  h1 { font-size: 20px; }
  .card { padding: 16px; }
  table.people { font-size: 12px; }
  table.people td.name { min-width: 70px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>식당 청소 일정 생성기</h1>
  <p class="subtitle">월~일 7일간, 매일 2명씩 청소 인원을 자동 배정합니다.</p>

  <!-- Status -->
  <div id="status" class="status green">
    <div class="dot"></div>
    <div id="statusText">충분한 인원이 확보되었습니다. 일정을 생성하세요.</div>
  </div>
  <div id="infoBanner" class="info-banner" style="display:none;"></div>

  <!-- People Section -->
  <div class="card">
    <h2>인원 설정 <span class="count" id="personCount"></span></h2>
    <div class="add-row">
      <input type="text" id="newName" placeholder="이름을 입력하세요" maxlength="20">
      <button class="btn btn-primary" id="addBtn">인원 추가</button>
    </div>

    <div class="table-wrap">
      <table class="people">
        <thead>
          <tr>
            <th>이름</th>
            <th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th><th>일</th>
            <th>주 2회</th>
            <th>미배정<br>우선순위</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="peopleBody"></tbody>
      </table>
    </div>
    <p style="font-size:12px; color:var(--muted); margin-top:10px;">
      체크박스(요일): 체크 = 해당 요일 <strong>불가</strong>. &nbsp;
      <strong>주 2회</strong>: 한 주에 2번 배정 가능. &nbsp;
      <strong>우선순위</strong>: 0~99, 높을수록 슬롯 초과 시 먼저 제외.
    </p>
  </div>

  <!-- Generate -->
  <div class="actions-row" style="margin-bottom:20px;">
    <button class="btn btn-primary btn-large" id="generateBtn">일정 생성</button>
    <button class="btn btn-secondary btn-large" id="resetBtn">초기화</button>
  </div>

  <!-- Result -->
  <div id="result" style="display:none;">
    <div class="card">
      <h2>주간 청소 일정</h2>
      <table class="schedule">
        <thead>
          <tr>
            <th>요일</th>
            <th>담당 1</th>
            <th>담당 2</th>
          </tr>
        </thead>
        <tbody id="scheduleBody"></tbody>
      </table>

      <div class="summary" id="summary"></div>
      <div id="exclusionList"></div>
      <div id="failList"></div>

      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-primary" id="regenBtn">재생성</button>
        <button class="btn btn-secondary" id="backBtn">다시 설정</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 상수 / 유틸
// ============================================================
const DAYS = ['월','화','수','목','금','토','일'];
const SLOTS_PER_DAY = 2;
const TOTAL_SLOTS = DAYS.length * SLOTS_PER_DAY; // 14
const DEFAULT_NAMES = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N'];

let people = []; // {id, name, restricted: bool[7], double: bool, priority: number}
let nextId = 1;
let lastResult = null; // 마지막으로 생성된 결과 (재생성 시 비교용)

function uid() { return nextId++; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ============================================================
// 초기 인원 세팅
// ============================================================
function initPeople() {
  people = DEFAULT_NAMES.map(name => ({
    id: uid(),
    name,
    restricted: [false, false, false, false, false, false, false],
    double: false,
    priority: 0
  }));
}

// ============================================================
// 렌더 — 인원 테이블
// ============================================================
const $ = (id) => document.getElementById(id);
const peopleBody = $('peopleBody');

function renderPeople() {
  peopleBody.innerHTML = '';
  for (const p of people) {
    const tr = document.createElement('tr');
    if (p.priority > 0) tr.classList.add('skip-tint');

    // 이름
    const nameTd = document.createElement('td');
    nameTd.className = 'name';
    nameTd.textContent = p.name;
    tr.appendChild(nameTd);

    // 요일 체크박스 (제한)
    for (let d = 0; d < 7; d++) {
      const td = document.createElement('td');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = p.restricted[d];
      cb.addEventListener('change', () => {
        p.restricted[d] = cb.checked;
        updateStatus();
      });
      td.appendChild(cb);
      tr.appendChild(td);
    }

    // 주 2회
    const dblTd = document.createElement('td');
    const dblCb = document.createElement('input');
    dblCb.type = 'checkbox';
    dblCb.checked = p.double;
    dblCb.addEventListener('change', () => {
      p.double = dblCb.checked;
      updateStatus();
    });
    dblTd.appendChild(dblCb);
    tr.appendChild(dblTd);

    // 우선순위
    const prTd = document.createElement('td');
    const prInput = document.createElement('input');
    prInput.type = 'number';
    prInput.min = 0;
    prInput.max = 99;
    prInput.value = p.priority;
    prInput.addEventListener('input', () => {
      let v = parseInt(prInput.value, 10);
      if (isNaN(v) || v < 0) v = 0;
      if (v > 99) v = 99;
      p.priority = v;
      tr.classList.toggle('skip-tint', v > 0);
      updateStatus();
    });
    prTd.appendChild(prInput);
    tr.appendChild(prTd);

    // 삭제
    const actTd = document.createElement('td');
    actTd.className = 'actions';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn btn-danger';
    delBtn.textContent = '삭제';
    delBtn.addEventListener('click', () => {
      people = people.filter(x => x.id !== p.id);
      renderPeople();
      updateStatus();
    });
    actTd.appendChild(delBtn);
    tr.appendChild(actTd);

    peopleBody.appendChild(tr);
  }

  $('personCount').textContent = `(현재 인원: ${people.length}명 / 총 배정 슬롯: ${TOTAL_SLOTS})`;
}

// ============================================================
// 상태 배너 (Red / Yellow / Green / Blue info)
// ============================================================
function maxCapacity() {
  // 각 사람 최대 가능 배정 횟수의 합
  return people.reduce((s, p) => s + (p.double ? 2 : 1), 0);
}
function activeCount() { return people.length; }

function updateStatus() {
  const cap = maxCapacity();
  const ban = $('infoBanner');
  const st = $('status');
  const stText = $('statusText');

  st.classList.remove('green','yellow','red');
  if (cap < TOTAL_SLOTS) {
    st.classList.add('red');
    stText.innerHTML = `최대 가능 배정 횟수가 ${cap}회입니다. 14 슬롯을 모두 채울 수 없습니다. (인원/주 2회 추가 필요)`;
  } else if (cap === TOTAL_SLOTS) {
    st.classList.add('yellow');
    stText.innerHTML = `최대 가능 배정 횟수가 정확히 14회입니다. 모든 "주 2회" 사용 시에만 가능.`;
  } else {
    st.classList.add('green');
    stText.innerHTML = `충분한 인원이 확보되었습니다. 일정을 생성하세요.`;
  }

  // 인원 > 14: 우선순위 기반 제외 예고
  if (activeCount() > TOTAL_SLOTS) {
    const excess = activeCount() - TOTAL_SLOTS;
    ban.style.display = '';
    ban.textContent = `${excess}명이 슬롯 초과로 제외될 예정입니다 (우선순위 높은 순).`;
  } else {
    ban.style.display = 'none';
  }
}

// ============================================================
// 인원 추가 / 초기화
// ============================================================
$('addBtn').addEventListener('click', () => {
  const input = $('newName');
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  if (people.some(p => p.name === name)) {
    alert('이미 같은 이름이 존재합니다.');
    return;
  }
  people.push({
    id: uid(),
    name,
    restricted: [false,false,false,false,false,false,false],
    double: false,
    priority: 0
  });
  input.value = '';
  renderPeople();
  updateStatus();
});
$('newName').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') $('addBtn').click();
});

$('resetBtn').addEventListener('click', () => {
  if (!confirm('인원과 설정을 모두 초기화합니다. 계속하시겠습니까?')) return;
  initPeople();
  renderPeople();
  updateStatus();
  $('result').style.display = 'none';
});

// ============================================================
// 우선순위 기반 스킵 로직
// 인원 > 14면 우선순위 높은 순으로 제외, 동순위는 랜덤.
// 우선순위 0은 절대 제외하지 않음 (다른 선택지가 없는 경우 제외).
// ============================================================
function applySkipPriority(input) {
  let active = input.slice();
  const skipped = [];

  // 1) priority > 0 부터 제외
  while (active.length > TOTAL_SLOTS) {
    const candidates = active.filter(p => p.priority > 0);
    if (candidates.length === 0) break;
    // 가장 높은 priority 찾기
    const maxPr = Math.max(...candidates.map(p => p.priority));
    const tied = shuffle(candidates.filter(p => p.priority === maxPr));
    const pick = tied[0];
    active = active.filter(p => p.id !== pick.id);
    skipped.push({ person: pick, reason: 'priority' });
  }

  // 2) 그래도 > 14면 priority 0 중 무작위 제외 (불가피)
  while (active.length > TOTAL_SLOTS) {
    const tied = shuffle(active);
    const pick = tied[0];
    active = active.filter(p => p.id !== pick.id);
    skipped.push({ person: pick, reason: 'forced' });
  }

  return { active, skipped };
}

// ============================================================
// 일정 생성 — 백트래킹 + 그리디 폴백
// ============================================================
function emptySchedule() {
  return Array.from({ length: 7 }, () => [null, null]);
}

function solveBacktrack(active, timeBudgetMs = 600) {
  // 각 사람 최대 배정 가능 횟수
  const maxAssign = p => p.double ? 2 : 1;
  const schedule = emptySchedule();
  const counts = new Map(active.map(p => [p.id, 0]));
  const start = Date.now();

  // 가장 제한이 많은 (배정 가능 인원이 적은) 요일 먼저 시도 — 휴리스틱
  const days = [0,1,2,3,4,5,6];
  const dayOrder = days.slice().sort((a, b) => {
    const ca = active.filter(p => !p.restricted[a]).length;
    const cb = active.filter(p => !p.restricted[b]).length;
    return ca - cb;
  });

  function recurse(idx) {
    if (Date.now() - start > timeBudgetMs) return 'TIMEOUT';
    if (idx === dayOrder.length) {
      // 모든 사람 최소 1회 배정 됐는지 검사
      for (const p of active) if (counts.get(p.id) < 1) return false;
      return true;
    }
    const day = dayOrder[idx];
    const available = shuffle(active.filter(p =>
      !p.restricted[day] && counts.get(p.id) < maxAssign(p)
    ));
    if (available.length < SLOTS_PER_DAY) return false;

    // 2명 조합 시도
    for (let i = 0; i < available.length; i++) {
      for (let j = i + 1; j < available.length; j++) {
        const a = available[i], b = available[j];
        schedule[day] = [a, b];
        counts.set(a.id, counts.get(a.id) + 1);
        counts.set(b.id, counts.get(b.id) + 1);

        const r = recurse(idx + 1);
        if (r === true) return true;
        if (r === 'TIMEOUT') return 'TIMEOUT';

        counts.set(a.id, counts.get(a.id) - 1);
        counts.set(b.id, counts.get(b.id) - 1);
        schedule[day] = [null, null];
      }
    }
    return false;
  }

  const ok = recurse(0);
  if (ok === true) return { schedule, complete: true };
  return null;
}

function solveGreedy(active) {
  // 백트래킹 실패 시: 가능한 만큼 채우고 미배정 슬롯/실패 인원 보고
  const maxAssign = p => p.double ? 2 : 1;
  const schedule = emptySchedule();
  const counts = new Map(active.map(p => [p.id, 0]));
  const failed = [];

  // 1) 모든 사람을 1회씩 배정 시도
  const order = shuffle(active.slice());
  for (const p of order) {
    const possible = shuffle([0,1,2,3,4,5,6].filter(d =>
      !p.restricted[d] && schedule[d].filter(Boolean).length < SLOTS_PER_DAY
    ));
    if (possible.length === 0) {
      const restrictedAll = p.restricted.every(x => x);
      failed.push({
        person: p,
        reason: restrictedAll ? '모든 요일 제한됨' : '가용 슬롯 부족'
      });
      continue;
    }
    const day = possible[0];
    const slotIdx = schedule[day].findIndex(x => x === null);
    schedule[day][slotIdx] = p;
    counts.set(p.id, 1);
  }

  // 2) 주 2회 가능 인원에 두 번째 일자 배정
  for (const p of shuffle(active.slice())) {
    if (!p.double || counts.get(p.id) !== 1) continue;
    const assignedDay = schedule.findIndex(slot => slot.some(x => x && x.id === p.id));
    const possible = shuffle([0,1,2,3,4,5,6].filter(d =>
      d !== assignedDay && !p.restricted[d] &&
      schedule[d].filter(Boolean).length < SLOTS_PER_DAY
    ));
    if (possible.length > 0) {
      const day = possible[0];
      const slotIdx = schedule[day].findIndex(x => x === null);
      schedule[day][slotIdx] = p;
      counts.set(p.id, 2);
    }
  }

  return { schedule, complete: false, failed };
}

function generate() {
  // 1단계: 우선순위 스킵
  const { active, skipped } = applySkipPriority(people);

  // 2단계: 백트래킹 — 못 풀면 그리디
  let res = solveBacktrack(active);
  let failed = [];

  if (!res) {
    const gr = solveGreedy(active);
    res = { schedule: gr.schedule, complete: false };
    failed = gr.failed;
  }

  // 3단계: 결과 통계
  let fullDays = 0, emptySlots = 0;
  for (const day of res.schedule) {
    const filled = day.filter(Boolean).length;
    if (filled === SLOTS_PER_DAY) fullDays++;
    emptySlots += SLOTS_PER_DAY - filled;
  }

  // 누가 두 번 배정되었는지 카운트
  const assignCount = new Map();
  for (const day of res.schedule) {
    for (const p of day) {
      if (!p) continue;
      assignCount.set(p.id, (assignCount.get(p.id) || 0) + 1);
    }
  }

  lastResult = {
    schedule: res.schedule,
    complete: res.complete,
    skipped,
    failed,
    fullDays,
    emptySlots,
    assignCount,
    active
  };

  renderResult(lastResult);
}

// ============================================================
// 결과 렌더
// ============================================================
function renderResult(r) {
  $('result').style.display = '';
  const body = $('scheduleBody');
  body.innerHTML = '';

  for (let d = 0; d < 7; d++) {
    const tr = document.createElement('tr');
    const slot = r.schedule[d];
    const filled = slot.filter(Boolean).length;
    if (filled === 0)        tr.className = 'empty';
    else if (filled < SLOTS_PER_DAY) tr.className = 'partial';
    else                     tr.className = 'full';

    const dayTd = document.createElement('td');
    dayTd.className = 'day-label';
    dayTd.textContent = DAYS[d] + '요일';
    tr.appendChild(dayTd);

    for (let s = 0; s < SLOTS_PER_DAY; s++) {
      const td = document.createElement('td');
      const p = slot[s];
      if (p) {
        const chip = document.createElement('span');
        chip.className = 'person-chip';
        chip.textContent = p.name;
        if (r.assignCount.get(p.id) === 2) {
          const b = document.createElement('span');
          b.className = 'badge-2x';
          b.textContent = '2회';
          chip.appendChild(b);
        }
        if (p.priority > 0) {
          const b = document.createElement('span');
          b.className = 'badge-priority';
          b.textContent = `우선순위 ${p.priority}`;
          chip.appendChild(b);
        }
        td.appendChild(chip);
      } else {
        const span = document.createElement('span');
        span.className = 'unassigned';
        span.textContent = '미배정';
        td.appendChild(span);
      }
      tr.appendChild(td);
    }
    body.appendChild(tr);
  }

  // 통계 카드
  const summary = $('summary');
  summary.innerHTML = '';
  function stat(label, value, cls) {
    const div = document.createElement('div');
    div.className = 'stat' + (cls ? ' ' + cls : '');
    div.innerHTML = `<div class="label">${label}</div><div class="value">${value}</div>`;
    summary.appendChild(div);
  }
  stat('완전 배정된 요일', `${r.fullDays} / 7`, r.fullDays === 7 ? 'ok' : (r.fullDays >= 4 ? '' : 'warn'));
  stat('미배정 슬롯', `${r.emptySlots}개`, r.emptySlots === 0 ? 'ok' : 'warn');
  stat('배정된 인원', `${r.assignCount.size}명`);
  stat('이번 주 제외', `${r.skipped.length}명`);

  // 우선순위로 제외된 인원
  const exDiv = $('exclusionList');
  exDiv.innerHTML = '';
  if (r.skipped.length > 0) {
    const wrap = document.createElement('div');
    wrap.className = 'exclusion-list';
    const h = document.createElement('h4');
    h.textContent = '이번 주 미배정 인원 (우선순위 기반)';
    wrap.appendChild(h);
    const ul = document.createElement('ul');
    for (const s of r.skipped) {
      const li = document.createElement('li');
      const reason = s.reason === 'priority'
        ? `우선순위 ${s.person.priority} - 슬롯 초과로 제외`
        : `슬롯 초과로 부득이 제외 (우선순위 0)`;
      li.innerHTML = `<strong>${s.person.name}</strong> <span class="badge-skip">제외</span> <span style="color:var(--muted);font-size:12px;">${reason}</span>`;
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
    exDiv.appendChild(wrap);
  }

  // 제한 때문에 배정 실패
  const failDiv = $('failList');
  failDiv.innerHTML = '';
  if (r.failed.length > 0) {
    const wrap = document.createElement('div');
    wrap.className = 'fail-list';
    const h = document.createElement('h4');
    h.textContent = '배정 실패 인원 (요일 제한/충돌)';
    wrap.appendChild(h);
    const ul = document.createElement('ul');
    for (const f of r.failed) {
      const li = document.createElement('li');
      li.innerHTML = `<strong>${f.person.name}</strong>: <span style="color:var(--muted);font-size:12px;">${f.reason}</span>`;
      ul.appendChild(li);
    }
    wrap.appendChild(ul);
    failDiv.appendChild(wrap);
  }

  // 결과 영역으로 스크롤
  $('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

$('generateBtn').addEventListener('click', () => {
  if (people.length === 0) { alert('인원이 없습니다. 먼저 인원을 추가하세요.'); return; }
  if (maxCapacity() < TOTAL_SLOTS) {
    if (!confirm(`최대 ${maxCapacity()}회 배정 가능합니다. 일부 슬롯이 미배정될 수 있는데, 그래도 생성하시겠습니까?`)) return;
  }
  generate();
});
$('regenBtn').addEventListener('click', generate);
$('backBtn').addEventListener('click', () => {
  $('result').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ============================================================
// 부팅
// ============================================================
initPeople();
renderPeople();
updateStatus();
</script>
</body>
