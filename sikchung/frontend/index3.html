<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>식당 청소 일정</title>
<script src="config.js" defer></script>
<script src="auth.js" defer></script>
<script src="api.js" defer></script>
<script src="permissions.js" defer></script>
<!-- 앱 스크립트 (로드 순서: 상수 → 스토어 → UI → 메인) -->
<script src="constants.js" defer></script>
<script src="people-store.js" defer></script>
<script src="ui.js" defer></script>
<script src="main.js" defer></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
  <div class="page-header">
    <div>
      <h1>식당 청소 일정</h1>
    </div>
    <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
      <div class="updated" id="updatedLabel"></div>
      <div id="authBar" style="display:none; align-items:center; gap:8px;">
        <span id="userDisplayName" style="font-size:12px; color:var(--muted);"></span>
        <span id="userRoleBadge" style="font-size:11px; padding:2px 8px; border-radius:99px; color:#fff; font-weight:600;"></span>
        <button class="btn btn-secondary" id="logoutBtn" style="padding:4px 10px; font-size:12px;">로그아웃</button>
      </div>
      <button class="btn btn-primary" id="loginBtn" style="padding:4px 10px; font-size:12px; display:none;">로그인</button>
    </div>
  </div>

  <!-- Status (UI 미노출 — 알고리즘 진단용 내부 요소만 유지) -->
  <div id="status" class="status green" style="display:none;">
    <div class="dot"></div>
    <div id="statusText"></div>
  </div>
  <div id="infoBanner" class="info-banner" style="display:none;"></div>

  <!-- People Section -->
  <div class="card" id="peopleSection">
    <h2>인원 설정 <span class="count" id="personCount"></span></h2>
    <div class="add-row" id="addRow">
      <input type="text" id="newName" placeholder="이름을 입력하세요" maxlength="20">
      <button class="btn btn-primary" id="addBtn">인원 추가</button>
    </div>

    <div class="people-grid" id="peopleGrid"></div>
    <p style="font-size:12px; color:var(--muted); margin-top:12px;">
      인원 칸을 눌러 편집
    </p>
  </div>

  <!-- 인원 편집 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="modalName">이름</h3>
        <button class="modal-close" id="modalClose" aria-label="닫기">×</button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label class="field-label">불가능한 시간</label>
          <div class="day-grid" id="modalDays"></div>
        </div>
        <div class="field">
          <label class="field-label">배정 옵션</label>
          <div class="inline-toggle" id="modalDoubleRow" style="margin-bottom:8px;">
            <div>
              <div class="label-text">주 2회 배정 가능</div>
            </div>
            <div class="switch" id="modalDouble"></div>
          </div>
          <div class="inline-toggle" id="modalRookieRow">
            <div>
              <div class="label-text">신병</div>
              <div class="label-sub">선임과 같이 들어감</div>
            </div>
            <div class="switch" id="modalRookie"></div>
          </div>
          <div class="inline-toggle" id="modalExcludedRow" style="margin-top:8px;">
            <div>
              <div class="label-text">일정 제외</div>
            </div>
            <div class="switch" id="modalExcluded"></div>
          </div>
        </div>
        <div class="field" style="display:none;">
          <label class="field-label" for="modalPriority">미배정 우선순위 (0 ~ 99)</label>
          <input type="number" min="0" max="99" class="priority-input" id="modalPriority">
        </div>
      </div>
      <div class="modal-foot">
        <div></div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary" id="modalReset">초기화</button>
          <button class="btn btn-primary" id="modalDone">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Generate -->
  <div class="actions-row" id="generateSection" style="margin-bottom:20px;">
    <button class="btn btn-primary btn-large" id="generateBtn">일정 생성</button>
    <button class="btn btn-secondary btn-large" id="resetBtn">새로고침</button>
  </div>

  <!-- 최신 일정 (멤버용 read-only, 분대장/관리자는 수정 가능) -->
  <div id="latestScheduleSection" style="display:none;" class="card">
    <h2 style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">최신 청소 일정 <span id="latestWeekId" style="font-size:13px; font-weight:400; color:var(--muted);"></span>
      <button class="btn btn-secondary" id="editLatestBtn" style="display:none; font-size:12px; padding:3px 10px; margin-left:auto;">수정</button>
      <button class="btn btn-secondary" id="deleteLatestBtn" style="display:none; font-size:12px; padding:3px 10px; color:#DC2626; border-color:#DC2626;">삭제</button>
    </h2>
    <div class="table-wrap">
      <table class="schedule">
        <thead>
          <tr><th>요일</th><th>아침</th><th>저녁</th></tr>
        </thead>
        <tbody id="latestScheduleBody"></tbody>
      </table>
    </div>
    <p id="latestScheduleEmpty" style="color:var(--muted); font-size:13px; margin-top:8px;">저장된 일정이 없습니다.</p>
  </div>

  <!-- Result -->
  <div id="result" style="display:none;">
    <div class="card">
      <h2>주간 청소 일정</h2>
      <div class="table-wrap">
        <table class="schedule">
          <thead>
            <tr>
              <th>요일</th>
              <th>아침</th>
              <th>저녁</th>
            </tr>
          </thead>
          <tbody id="scheduleBody"></tbody>
        </table>
      </div>

      <div class="summary" id="summary"></div>
      <div id="exclusionList"></div>
      <div id="failList"></div>

      <div id="editPanel" style="display:none;"></div>

      <div class="actions-row" style="margin-top:18px;">
        <button class="btn btn-primary" id="regenBtn">재생성</button>
        <button class="btn btn-secondary" id="editBtn">편집</button>
        <button class="btn btn-secondary" id="backBtn">다시 설정</button>
      </div>
      <div id="saveScheduleRow" style="display:none; margin-top:10px;">
        <button class="btn btn-primary" id="saveScheduleBtn" style="background:var(--green); border-color:var(--green);">확정 저장</button>
        <span id="saveScheduleStatus" style="font-size:12px; color:var(--muted); margin-left:8px;"></span>
      </div>
    </div>
  </div>
</div>


<!-- Eruda 디버그 콘솔 — URL에 ?debug=1 또는 ?eruda=1 이 있을 때만 로드 -->
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('debug') !== '1' && q.get('eruda') !== '1') return;
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/eruda';
  s.onload = function () { eruda.init(); };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
