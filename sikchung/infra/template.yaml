AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sikchung cleaning schedule - AWS backend + frontend hosting (S3 + CloudFront)

Parameters:
  CorsAllowOrigin:
    Type: String
    Default: "*"
    Description: >
      HttpApi CORS AllowOrigin.
      최초 배포: default "*".
      이후: deploy.yml이 기존 CloudFrontDomain 출력값을 읽어 "https://CF_DOMAIN" 주입.

# prod(스택명 sikchung)는 기존 물리 이름 그대로 유지 — 변경 시 테이블/버킷/도메인
# 교체(replace)로 데이터 유실. 그 외 스택(sikchung-dev 등)만 스택명 기반 이름 사용.
Conditions:
  IsProdStack: !Equals [!Ref "AWS::StackName", "sikchung"]

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref SikchungDataTable
    # NOTE: USER_POOL_ID는 Globals에 넣지 않음
    # UserPool이 PostConfirmationFunction.Arn을 참조하므로
    # Globals에 !Ref UserPool 추가 시 순환 의존성 발생.
    # USER_POOL_ID는 AdminFunction에만 명시적으로 선언.
    # NOTE: Runtime은 Globals에서 제외 (이미지 함수와 공존 불가).
    # 각 zip 함수에 Runtime: nodejs22.x 를 명시.

Resources:

  # ── Cognito ────────────────────────────────────────────────────────────────

  # NOTE: username 기반 로그인 (아이디 = wjdqhwndeoNN).
  # UsernameAttributes / AutoVerifiedAttributes 제거 → 이메일 불필요.
  # UsernameAttributes 변경은 교체(replace) 트리거이므로 UserPool 재생성됨
  # → UserPoolId/ClientId 변경, 기존 사용자 전원 삭제 (의도된 동작).
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: SikchungUserPool
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: displayName
          AttributeDataType: String
          Mutable: true
          Required: false
          StringAttributeConstraints:
            MaxLength: "50"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        UnusedAccountValidityDays: 90   # 임시 비번 유효기간 (기본 7일 → 90일, CF 속성명)
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  LeaderGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: leader
      UserPoolId: !Ref UserPool

  MemberGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: member
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: SikchungWebClient
      GenerateSecret: false
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      AllowedOAuthFlowsUserPoolClient: true
      CallbackURLs:
        - https://placeholder.example.com/callback   # 5단계에서 CloudFront URL로 교체
        - http://localhost:8080/index3.html           # 4단계 로컬 테스트용
      LogoutURLs:
        - https://placeholder.example.com/
        - http://localhost:8080/index3.html           # 4단계 로컬 테스트용
      SupportedIdentityProviders:
        - COGNITO

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !If
        - IsProdStack
        - !Sub "sikchung-auth-${AWS::AccountId}"
        - !Sub "${AWS::StackName}-auth-${AWS::AccountId}"

  # ── DynamoDB ───────────────────────────────────────────────────────────────

  SikchungDataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !If [IsProdStack, SikchungData, !Sub "${AWS::StackName}-data"]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ── HTTP API Gateway ───────────────────────────────────────────────────────

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowOrigin
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        AllowHeaders:
          - Authorization
          - Content-Type
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"
        DefaultAuthorizer: CognitoAuthorizer

  # ── Lambda Functions ───────────────────────────────────────────────────────

  MeFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/me.handler
      Events:
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /me
        PutMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /me
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SikchungDataTable.Arn

  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/members.handler
      Events:
        GetMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /members
        PutMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /member/{sub}
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query      # listMembers
                - dynamodb:GetItem    # getMember (존재 확인 후 수정)
                - dynamodb:UpdateItem # updateMember
                - dynamodb:PutItem    # writeAudit (MEMBER_UPDATE)
              Resource: !GetAtt SikchungDataTable.Arn

  ScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/schedule.handler
      Events:
        PostSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /schedule
        GetLatestSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /schedule/latest
        DeleteLatestSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /schedule/latest
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query      # getLatestSchedule (ScanIndexForward: false)
                - dynamodb:PutItem    # putSchedule
                - dynamodb:DeleteItem # deleteLatestSchedule
              Resource: !GetAtt SikchungDataTable.Arn

  GenerateScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.generate_schedule.handler"]
      Architectures: [arm64]
      Timeout: 28
      MemorySize: 2048
      Events:
        PostGenerateSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /schedule/generate
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem   # writeAudit (SCHEDULE_GENERATE)
              Resource: !GetAtt SikchungDataTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../backend

  GenerateFlexScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      ImageConfig:
        Command: ["handlers.generate_flex_schedule.handler"]
      Architectures: [arm64]
      Timeout: 28
      MemorySize: 2048
      Events:
        PostGenerateFlexSchedule:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /schedule/flex/generate
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:PutItem   # writeAudit (FLEX_SCHEDULE_GENERATE)
              Resource: !GetAtt SikchungDataTable.Arn
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ../backend

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/admin.handler
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool   # AdminFunction에만 명시 (순환 의존성 회피)
      Events:
        PostUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /user
        DeleteUser:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: DELETE
            Path: /user/{sub}
        PutUserRole:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: PUT
            Path: /user/{sub}/role
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem    # email 조회 (DELETE/role-change)
                - dynamodb:PutItem    # MEMBER 생성 (POST /user)
                - dynamodb:DeleteItem # MEMBER 삭제 (DELETE /user)
              Resource: !GetAtt SikchungDataTable.Arn
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
                - cognito-idp:AdminListGroupsForUser
                - cognito-idp:ListUsers
              Resource: !GetAtt UserPool.Arn

  AuditLogFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/auditLog.handler
      Events:
        GetAudit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /audit
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query   # listAuditLogs (조회 전용)
              Resource: !GetAtt SikchungDataTable.Arn

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs22.x
      CodeUri: ../backend/
      Handler: handlers/postConfirmation.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem  # 기존 레코드 확인 (중복 생성 방지)
                - dynamodb:PutItem  # MEMBER 기본값 레코드 생성
              Resource: !GetAtt SikchungDataTable.Arn

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PostConfirmationFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ── CloudWatch Log Groups ───────────────────────────────────────────────────
  # 로그 보존(30일)은 CFN이 아닌 배포 후 단계(deploy-backend.yml)에서
  # aws logs put-retention-policy 로 설정한다. Lambda가 로그그룹을 자동 생성하는
  # 구조상 CFN이 동명 로그그룹을 만들려 하면 충돌·롤백이 발생하므로,
  # 충돌·삭제권한 의존이 없는 멱등 방식을 사용한다.

  # ── S3 (frontend hosting) ──────────────────────────────────────────────────

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If
        - IsProdStack
        - !Sub "sikchung-frontend-${AWS::AccountId}"
        - !Sub "${AWS::StackName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced   # ACL 비활성 (권장)

  # OAC: CloudFront → S3 SigV4 서명. CloudFront만이 버킷에 접근 가능.
  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !If
          - IsProdStack
          - !Sub "sikchung-oac-${AWS::AccountId}"
          - !Sub "${AWS::StackName}-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ── CloudFront Cache Policies ──────────────────────────────────────────────

  HtmlCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !If
          - IsProdStack
          - !Sub "sikchung-html-${AWS::AccountId}"
          - !Sub "${AWS::StackName}-html-${AWS::AccountId}"
        Comment: HTML — 60s TTL (배포 후 빠른 반영)
        DefaultTTL: 60
        MinTTL: 0
        MaxTTL: 60
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  AssetsCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !If
          - IsProdStack
          - !Sub "sikchung-assets-${AWS::AccountId}"
          - !Sub "${AWS::StackName}-assets-${AWS::AccountId}"
        Comment: JS/CSS — 1 day TTL
        DefaultTTL: 86400
        MinTTL: 0
        MaxTTL: 86400
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  # ── CloudFront Distribution ────────────────────────────────────────────────

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Sikchung frontend (index3.html)
        DefaultRootObject: index3.html
        PriceClass: PriceClass_200   # 한국 포함 최소 비용 등급
        HttpVersion: http2
        IPV6Enabled: true
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""   # OAC 사용 시 빈 문자열
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods:  [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref HtmlCachePolicy
        CacheBehaviors:
          - PathPattern: "*.js"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods:  [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AssetsCachePolicy
          - PathPattern: "*.css"
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods:  [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AssetsCachePolicy
        # SPA 라우팅: 404/403도 index3.html로 (200 응답)
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index3.html
            ErrorCachingMinTTL: 60
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index3.html
            ErrorCachingMinTTL: 60
        ViewerCertificate:
          CloudFrontDefaultCertificate: true   # *.cloudfront.net 기본 인증서

  # CloudFront OAC만 GetObject 허용
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

# ── Outputs ──────────────────────────────────────────────────────────────────

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: !Sub "${AWS::StackName}-UserPoolId"

  ClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}-ClientId"

  CognitoDomain:
    Description: Cognito Hosted UI base URL
    Value: !Sub "https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
    Export:
      Name: !Sub "${AWS::StackName}-CognitoDomain"

  ApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiEndpoint"

  TableName:
    Description: DynamoDB table name
    Value: !Ref SikchungDataTable
    Export:
      Name: !Sub "${AWS::StackName}-TableName"

  CloudFrontDomain:
    Description: CloudFront distribution domain (앱 접속 URL)
    Value: !GetAtt CloudFrontDistribution.DomainName
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDomain"

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (캐시 무효화에 사용)
    Value: !Ref CloudFrontDistribution
    Export:
      Name: !Sub "${AWS::StackName}-CloudFrontDistributionId"

  FrontendBucketName:
    Description: 프론트엔드 정적 자원이 저장될 S3 버킷명
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub "${AWS::StackName}-FrontendBucketName"
