#
# Gradle Daemon JVM criteria (Gradle 8.8+).
# Forces ./gradlew to launch its own daemon on JDK 17, regardless of the
# JAVA_HOME / system default JVM. If JDK 17 is not installed, Gradle will
# auto-provision one via the Foojay toolchain resolver configured in
# settings.gradle.
#
toolchainVersion=17
