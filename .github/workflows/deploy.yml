name: Deploy Sikchung Backend

on:
  push:
    branches: [main]
    paths:
      - 'sikchung/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 20 ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sikchung/backend/package-lock.json

      # ── 3. AWS credentials ─────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. SAM CLI ─────────────────────────────────────────────────────────
      - name: Install SAM CLI
        run: pip install aws-sam-cli

      # ── 5. Install backend dependencies ───────────────────────────────────
      - name: Install backend dependencies
        working-directory: sikchung/backend
        run: npm ci

      # ── 6. SAM build ───────────────────────────────────────────────────────
      - name: SAM build
        working-directory: sikchung/infra
        run: sam build

      # ── 7. SAM deploy ──────────────────────────────────────────────────────
      - name: SAM deploy
        working-directory: sikchung/infra
        run: sam deploy

