name: Deploy Sikchung Backend

on:
  push:
    branches:
      - main
      - 'claude/sikchung-aws-backend-scaffold-GoqEk'
      - 'claude/hopeful-noether-tJoCC'
    paths:
      - 'sikchung/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js 22 ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sikchung/backend/package-lock.json

      # ── 3. AWS credentials ─────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      # ── 4. SAM CLI (pip 캐시로 재설치 시간 단축) ──────────────────────────
      - name: Cache pip (SAM CLI)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sam-${{ hashFiles('.github/workflows/deploy.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-sam-

      - name: Install SAM CLI
        run: pip install aws-sam-cli

      # ── 5. Install backend dependencies ───────────────────────────────────
      - name: Install backend dependencies
        working-directory: sikchung/backend
        run: npm ci

      # ── 6. QEMU + Buildx (arm64 컨테이너 이미지 빌드용) ──────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 7. SAM build ───────────────────────────────────────────────────────
      - name: SAM build
        working-directory: sikchung/infra
        run: sam build

      # ── 8. SAM deploy ──────────────────────────────────────────────────────
      # 기존 스택의 CloudFrontDomain 출력값을 조회해 CorsAllowOrigin으로 주입.
      # 스택이 없거나 출력값이 없는 최초 배포 시에는 파라미터 없이 실행 → default "*".
      - name: SAM deploy
        working-directory: sikchung/infra
        run: |
          CF=$(aws cloudformation describe-stacks \
            --stack-name sikchung \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" \
            --output text 2>/dev/null || true)
          if [ -n "$CF" ] && [ "$CF" != "None" ]; then
            echo "CorsAllowOrigin=https://$CF"
            sam deploy --parameter-overrides "CorsAllowOrigin=https://$CF"
          else
            echo "CloudFrontDomain 없음 (최초 배포) — CorsAllowOrigin default '*' 사용"
            sam deploy
          fi

      # ── 9. 스택 출력값 수집 ────────────────────────────────────────────────
      - name: Get stack outputs
        id: outputs
        run: |
          aws cloudformation describe-stacks --stack-name sikchung --query 'Stacks[0].Outputs' --output json > outputs.json
          echo "cf_domain=$(jq -r '.[] | select(.OutputKey=="CloudFrontDomain") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "dist_id=$(jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "user_pool_id=$(jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "client_id=$(jq -r '.[] | select(.OutputKey=="ClientId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(jq -r '.[] | select(.OutputKey=="CognitoDomain") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT

      # ── 10. Cognito 콜백/로그아웃 URL 을 CloudFront 도메인으로 업데이트 ────
      # update-user-pool-client 는 전체 교체이므로 OAuth 설정도 함께 명시.
      - name: Update Cognito callback URLs
        run: |
          aws cognito-idp update-user-pool-client \
            --user-pool-id "${{ steps.outputs.outputs.user_pool_id }}" \
            --client-id    "${{ steps.outputs.outputs.client_id }}" \
            --callback-urls "https://${{ steps.outputs.outputs.cf_domain }}/" \
            --logout-urls   "https://${{ steps.outputs.outputs.cf_domain }}/" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid email profile \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO

      # ── 11. frontend/config.js 자동 생성 ───────────────────────────────────
      # 새 명명규약(cognitoUserPoolId 등) + auth.js 호환 별칭(clientId, redirectUri)
      - name: Generate frontend config
        run: |
          cat > sikchung/frontend/config.js <<EOF
          window.APP_CONFIG = {
            apiEndpoint:       '${{ steps.outputs.outputs.api_endpoint }}',
            cognitoUserPoolId: '${{ steps.outputs.outputs.user_pool_id }}',
            cognitoClientId:   '${{ steps.outputs.outputs.client_id }}',
            cognitoDomain:     '${{ steps.outputs.outputs.cognito_domain }}',
            cloudfrontDomain:  '${{ steps.outputs.outputs.cf_domain }}',
            region:            'ap-northeast-2',
            // auth.js 호환 별칭
            clientId:          '${{ steps.outputs.outputs.client_id }}',
            redirectUri:       'https://${{ steps.outputs.outputs.cf_domain }}/',
          };
          EOF

      # ── 12. 프론트엔드를 S3 로 sync ────────────────────────────────────────
      - name: Sync frontend to S3
        run: aws s3 sync sikchung/frontend/ s3://${{ steps.outputs.outputs.s3_bucket }}/ --delete

      # ── 13. CloudFront 캐시 무효화 ─────────────────────────────────────────
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.dist_id }} --paths "/*"

      # ── 14. 배포 URL 출력 ──────────────────────────────────────────────────
      - name: Output deployment URL
        run: |
          echo "=== Deployed ==="
          echo "URL: https://${{ steps.outputs.outputs.cf_domain }}"
          {
            echo "## 배포 완료"
            echo ""
            echo "**URL**: <https://${{ steps.outputs.outputs.cf_domain }}>"
            echo ""
            echo "최초 배포 후 CloudFront 전파에 10~20분 소요될 수 있음."
          } >> $GITHUB_STEP_SUMMARY

      # ── 15. 스택 출력값 → Job Summary ──────────────────────────────────────
      - name: Print stack outputs
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 스택 출력값" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          jq -r '.[] | "| " + .OutputKey + " | `" + .OutputValue + "` |"' outputs.json >> $GITHUB_STEP_SUMMARY
