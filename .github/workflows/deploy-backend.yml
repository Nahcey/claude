name: Deploy Sikchung Backend (OIDC + single ECR repo)

on:
  push:
    branches:
      - main
    paths:
      - 'sikchung/backend/**'
      - 'sikchung/infra/**'
      - 'sikchung/frontend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 필수
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPO: sikchung

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. AWS credentials (OIDC) ──────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}

      # ── 3. ACCOUNT_ID 추출 (ARN/URI 하드코딩 금지) ────────────────────────
      - name: Resolve account ID
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      # ── 4. ECR repo ensure + lifecycle policy (멱등) ───────────────────────
      - name: Ensure ECR repository
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPO" >/dev/null 2>&1; then
            echo "ECR repo '$ECR_REPO' 없음 — 생성"
            aws ecr create-repository --repository-name "$ECR_REPO" >/dev/null
          else
            echo "ECR repo '$ECR_REPO' 존재"
          fi
          # untagged 이미지를 push 1일 후 expire (멱등 적용)
          aws ecr put-lifecycle-policy \
            --repository-name "$ECR_REPO" \
            --lifecycle-policy-text '{
              "rules": [
                {
                  "rulePriority": 1,
                  "description": "Expire untagged images after 1 day",
                  "selection": {
                    "tagStatus": "untagged",
                    "countType": "sinceImagePushed",
                    "countUnit": "days",
                    "countNumber": 1
                  },
                  "action": { "type": "expire" }
                }
              ]
            }' >/dev/null
          echo "lifecycle policy 적용 완료"

      # ── 4.5. ECR 로그인 (sam deploy의 docker push 인증 보장) ──────────────
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4.6. QEMU + Buildx (arm64 컨테이너 이미지 빌드용) ──────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. SAM CLI ─────────────────────────────────────────────────────────
      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 6. SAM build ───────────────────────────────────────────────────────
      - name: SAM build
        working-directory: sikchung/infra
        run: sam build -t template.yaml

      # ── 7. SAM deploy (단일 repo로 모든 Image 함수 push → 레이어 dedup) ────
      - name: SAM deploy
        working-directory: sikchung/infra
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --image-repository "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}"

      # ── 8. 스택 출력값 수집 (기존 deploy.yml에서 이전) ─────────────────────
      - name: Get stack outputs
        id: outputs
        run: |
          aws cloudformation describe-stacks --stack-name sikchung --query 'Stacks[0].Outputs' --output json > outputs.json
          echo "cf_domain=$(jq -r '.[] | select(.OutputKey=="CloudFrontDomain") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "dist_id=$(jq -r '.[] | select(.OutputKey=="CloudFrontDistributionId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "s3_bucket=$(jq -r '.[] | select(.OutputKey=="FrontendBucketName") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "user_pool_id=$(jq -r '.[] | select(.OutputKey=="UserPoolId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "client_id=$(jq -r '.[] | select(.OutputKey=="ClientId") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "cognito_domain=$(jq -r '.[] | select(.OutputKey=="CognitoDomain") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT
          echo "api_endpoint=$(jq -r '.[] | select(.OutputKey=="ApiEndpoint") | .OutputValue' outputs.json)" >> $GITHUB_OUTPUT

      # ── 9. Cognito 콜백/로그아웃 URL 을 CloudFront 도메인으로 업데이트 ─────
      # update-user-pool-client 는 전체 교체이므로 OAuth 설정도 함께 명시.
      - name: Update Cognito callback URLs
        run: |
          aws cognito-idp update-user-pool-client \
            --user-pool-id "${{ steps.outputs.outputs.user_pool_id }}" \
            --client-id    "${{ steps.outputs.outputs.client_id }}" \
            --callback-urls "https://${{ steps.outputs.outputs.cf_domain }}/" \
            --logout-urls   "https://${{ steps.outputs.outputs.cf_domain }}/" \
            --allowed-o-auth-flows code \
            --allowed-o-auth-scopes openid email profile \
            --allowed-o-auth-flows-user-pool-client \
            --supported-identity-providers COGNITO

      # ── 10. frontend/config.js 자동 생성 ───────────────────────────────────
      # 새 명명규약(cognitoUserPoolId 등) + auth.js 호환 별칭(clientId, redirectUri)
      - name: Generate frontend config
        run: |
          cat > sikchung/frontend/config.js <<EOF
          window.APP_CONFIG = {
            apiEndpoint:       '${{ steps.outputs.outputs.api_endpoint }}',
            cognitoUserPoolId: '${{ steps.outputs.outputs.user_pool_id }}',
            cognitoClientId:   '${{ steps.outputs.outputs.client_id }}',
            cognitoDomain:     '${{ steps.outputs.outputs.cognito_domain }}',
            cloudfrontDomain:  '${{ steps.outputs.outputs.cf_domain }}',
            region:            'ap-northeast-2',
            // auth.js 호환 별칭
            clientId:          '${{ steps.outputs.outputs.client_id }}',
            redirectUri:       'https://${{ steps.outputs.outputs.cf_domain }}/',
          };
          EOF

      # ── 11. 프론트엔드를 S3 로 sync ────────────────────────────────────────
      - name: Sync frontend to S3
        run: aws s3 sync sikchung/frontend/ s3://${{ steps.outputs.outputs.s3_bucket }}/ --delete

      # ── 12. CloudFront 캐시 무효화 ─────────────────────────────────────────
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.outputs.outputs.dist_id }} --paths "/*"

      # ── 13. 배포 URL + 스택 출력값 → Job Summary ───────────────────────────
      - name: Output deployment summary
        run: |
          echo "=== Deployed ==="
          echo "URL: https://${{ steps.outputs.outputs.cf_domain }}"
          {
            echo "## 배포 완료"
            echo ""
            echo "**URL**: <https://${{ steps.outputs.outputs.cf_domain }}>"
            echo ""
            echo "## 스택 출력값"
            echo ""
            echo "| Key | Value |"
            echo "|-----|-------|"
            jq -r '.[] | "| " + .OutputKey + " | `" + .OutputValue + "` |"' outputs.json
          } >> $GITHUB_STEP_SUMMARY
